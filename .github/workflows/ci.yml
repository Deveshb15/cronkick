name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # redeploy main by hand; re-running an older run puts that release back

# Pull requests: a new push cancels the old run. main: deploys never overlap; a newer one waits its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOSTS: 167.172.252.36 64.225.7.86 # cronkick-1, cronkick-2
  FIREWALL_ID: 7da5f45b-374e-4471-ae89-4debff78fbe4 # cronkick-fw
  RELEASE: ${{ github.run_number }}-${{ github.sha }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cronkick
          POSTGRES_PASSWORD: cronkick
          POSTGRES_DB: cronkick_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cronkick" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cronkick:cronkick@localhost:5432/cronkick_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the worker
        run: npx tsc --noEmit --incremental false
      - name: Type-check the website
        run: npx tsc --noEmit --incremental false -p web
      - name: Tests
        run: npx vitest run

  # Runs alongside the tests: it only stages the release on the servers. Nothing live changes until both pass.
  build:
    name: Build and upload
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env: &ssh
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - name: Build the site
        run: deploy/release.sh build "$RELEASE"
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      - name: Open SSH for this runner
        run: deploy/ci-ssh.sh open
      - name: Upload to both servers
        run: |
          pids=()
          for h in $HOSTS; do deploy/release.sh upload "$h" "$RELEASE" & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p"; done
      - name: Close SSH
        if: always()
        run: deploy/ci-ssh.sh close

  migrate:
    name: Migrate database
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env: *ssh
    steps:
      - uses: actions/checkout@v5
      - name: Open SSH for this runner
        run: deploy/ci-ssh.sh open
      - name: Apply new migrations
        run: |
          echo '### Migrations' >> "$GITHUB_STEP_SUMMARY"
          deploy/release.sh migrate "${HOSTS%% *}" "$RELEASE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close SSH
        if: always()
        run: deploy/ci-ssh.sh close

  # One server at a time, so the other keeps sending triggers. A server that doesn't come up healthy is
  # switched back to the previous release, and the next one is never touched.
  live:
    name: Go live (${{ matrix.name }})
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { name: cronkick-1, host: 167.172.252.36 }
          - { name: cronkick-2, host: 64.225.7.86 }
    environment:
      name: production
      url: https://cronkick.xyz
    env: *ssh
    steps:
      - uses: actions/checkout@v5
      - name: Open SSH for this runner
        run: deploy/ci-ssh.sh open
      - name: Switch, restart and wait until healthy
        run: deploy/release.sh live "${{ matrix.host }}" "$RELEASE"
      - name: Close SSH
        if: always()
        run: deploy/ci-ssh.sh close

  verify:
    name: Check cronkick.xyz
    needs: live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The public site serves this release and dispatch is healthy
        run: |
          curl -fsS https://cronkick.xyz/ | grep -q "dpl=$RELEASE" || { echo "cronkick.xyz is not serving $RELEASE"; exit 1; }
          for i in $(seq 1 20); do curl -fsS https://cronkick.xyz/healthz/dispatch && exit 0; sleep 3; done
          exit 1
      - name: Summary
        run: |
          echo "### Live on cronkick.xyz" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${GITHUB_SHA::7}\` · release \`$RELEASE\` · cronkick-1 and cronkick-2" >> "$GITHUB_STEP_SUMMARY"

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cronkick
          POSTGRES_PASSWORD: cronkick
          POSTGRES_DB: cronkick_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cronkick" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cronkick:cronkick@localhost:5432/cronkick_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the worker
        run: npx tsc --noEmit --incremental false
      - name: Type-check the website
        run: npx tsc --noEmit --incremental false -p web
      - name: Tests
        run: npx vitest run

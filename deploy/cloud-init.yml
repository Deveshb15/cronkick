#cloud-config
# Base setup for an Cronkick droplet. Pass with: doctl compute droplet create ... --user-data-file deploy/cloud-init.yml
package_update: true
packages: [curl, rsync]
runcmd:
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - useradd --system --home /opt/cronkick --shell /usr/sbin/nologin cronkick || true
  - mkdir -p /opt/cronkick /etc/cronkick
  - chown cronkick:cronkick /opt/cronkick
  - chmod 700 /etc/cronkick
  # Triggers are only as on-time as this clock.
  - timedatectl set-ntp true
